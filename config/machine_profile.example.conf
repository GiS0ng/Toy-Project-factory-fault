# 이 값은 실행 형식을 보여 주기 위한 비인증 예시입니다.
# zone_* 값은 보유한 ISO 20816-3:2022 문서와 설비 담당자의 판단에 따라 교체하세요.
standard=ISO 20816-3:2022
machine_group=DEMO_REPLACE_WITH_APPROVED_PROFILE
support_type=rigid
rated_power_kw=20
operating_speed_rpm=1500
zone_ab_mm_s_rms=2.0
zone_bc_mm_s_rms=4.0
zone_cd_mm_s_rms=6.0
consecutive_zone_d_limit=4
sample_interval_ms=3000
save_interval_seconds=1800
telemetry_host=127.0.0.1
telemetry_port=9999
protocol=json
data_directory=data_queue
